version: '3.8'

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: tz_n8n
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./src/n8n/workflows:/workflows
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
    depends_on:
      - ollama
      # для питон сервиса
      # - python-parser
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    container_name: tz_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  n8n_data:
  ollama_data: